name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de debug
        env:
          # Opcional: variável (não segredo) do GitHub com o endereço do servidor de IA
          ORG_GRADLE_PROJECT_SERVIDOR_URL: ${{ vars.SERVIDOR_URL }}
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: venda-clara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
